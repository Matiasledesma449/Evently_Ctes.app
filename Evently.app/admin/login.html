<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evently - Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
            <span class="text-4xl font-bold text-violet-600">Evently</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-4">Bienvenido</h1>
            <p class="text-gray-500 text-sm">Ingresa a tu cuenta para gestionar eventos.</p>
        </div>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                    <input type="email" id="email" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none" placeholder="correo@ejemplo.com" required />
                </div>
            </div>
            <div class="mb-6">
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <a href="#" class="text-sm text-violet-600 hover:underline">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                    <input type="password" id="password" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none" placeholder="••••••••" required />
                </div>
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-semibold py-3 rounded-full transition shadow-md">
                Iniciar sesión
            </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">
            ¿No tienes una cuenta? <a href="#" class="text-violet-600 font-semibold hover:underline">Solicitar acceso</a>
        </p>
        <div id="mensajeError" class="mt-4 text-center text-sm text-red-500 hidden"></div>
    </div>

    <!-- Firebase -->
    <script type="module" src="../shared/firebase-init.js"></script>
    <script type="module">
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const btnLogin = document.getElementById('btnLogin');
        const mensajeError = document.getElementById('mensajeError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeError.classList.add('hidden');

            const email = emailInput.value.trim();
            const password = passInput.value.trim();

            if (!email || !password) {
                mensajeError.textContent = 'Ingresa usuario y contraseña.';
                mensajeError.classList.remove('hidden');
                return;
            }

            try {
                btnLogin.textContent = 'Ingresando...';
                btnLogin.disabled = true;

                await signInWithEmailAndPassword(auth, email, password);
                // Redirigir al dashboard
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error('Error de login:', error);
                let msg = 'Error al iniciar sesión. Verifica tus credenciales.';
                if (error.code === 'auth/user-not-found') {
                    msg = 'Usuario no encontrado.';
                } else if (error.code === 'auth/wrong-password') {
                    msg = 'Contraseña incorrecta.';
                }
                mensajeError.textContent = msg;
                mensajeError.classList.remove('hidden');
                btnLogin.textContent = 'Iniciar sesión';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
