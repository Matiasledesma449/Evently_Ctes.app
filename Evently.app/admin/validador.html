<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evently - Validador QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/evently.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f9f9f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #video-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        .result-box {
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 16px;
        }
        .success {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #16a34a;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #dc2626;
        }
        .info {
            background: #f3f4f6;
            color: #1f2937;
            border: 2px solid #d1d5db;
        }
        .btn-retry {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #7c3aed;
            color: white;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-retry:hover {
            background: #5b21b6;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-violet-600">Evently <span class="text-gray-800">Validador</span></h1>
            <p class="text-sm text-gray-500">Escanea el QR de la entrada</p>
        </div>

        <div id="video-container">
            <video id="video" playsinline></video>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>

        <div id="resultado" class="result-box info">
            <span class="material-symbols-outlined text-3xl">qr_code_scanner</span><br>
            Apunta la cámara al código QR
        </div>

        <button id="btnReiniciar" class="btn-retry hidden" onclick="reiniciarEscaneo()">
            Escanear otra entrada
        </button>
    </div>

    <!-- Librería jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        let scanning = true;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultado = document.getElementById('resultado');
        const btnReiniciar = document.getElementById('btnReiniciar');

        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                await video.play();
                requestAnimationFrame(escanearCuadro);
            } catch (err) {
                resultado.className = 'result-box error';
                resultado.innerHTML = 'Error al acceder a la cámara. Permite el acceso.';
                console.error(err);
            }
        }

        function escanearCuadro() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });
                if (code && code.data) {
                    scanning = false;
                    procesarQR(code.data);
                    return;
                }
            }
            requestAnimationFrame(escanearCuadro);
        }

        function procesarQR(qrData) {
            // Simulación de validación (reemplazar con consulta a backend real)
            const esValido = qrData.includes('valido') || qrData.includes('ENTRADA-');
            if (esValido) {
                resultado.className = 'result-box success';
                resultado.innerHTML = `
                    <span class="material-symbols-outlined text-3xl">check_circle</span><br>
                    <span class="font-bold text-lg">✅ Entrada válida</span><br>
                    <span class="text-sm">${qrData}</span>
                `;
            } else {
                resultado.className = 'result-box error';
                resultado.innerHTML = `
                    <span class="material-symbols-outlined text-3xl">error</span><br>
                    <span class="font-bold text-lg">❌ QR inválido o ya utilizado</span><br>
                    <span class="text-sm">${qrData}</span>
                `;
            }
            btnReiniciar.classList.remove('hidden');
            // Opcional: detener la cámara para ahorrar batería
            // video.srcObject?.getTracks().forEach(track => track.stop());
        }

        function reiniciarEscaneo() {
            scanning = true;
            btnReiniciar.classList.add('hidden');
            resultado.className = 'result-box info';
            resultado.innerHTML = `
                <span class="material-symbols-outlined text-3xl">qr_code_scanner</span><br>
                Apunta la cámara al código QR
            `;
            if (!video.srcObject) {
                iniciarCamara();
            } else {
                requestAnimationFrame(escanearCuadro);
            }
        }

        window.onload = iniciarCamara;
    </script>
</body>
</html>
