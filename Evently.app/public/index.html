<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evently - Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        /* 👇 CAMBIO PRINCIPAL: body con flex column y min-height */
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        /* 👇 main ocupa el espacio restante para empujar el footer abajo */
        main {
            flex: 1;
        }

        .event-card {
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            border-radius: 16px;
            overflow: hidden;
            flex: 0 0 auto;
            width: 280px;
            scroll-snap-align: start;
        }
        .event-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.10);
        }
        .event-image {
            height: 160px;
            background-color: #ede9fe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            font-size: 3rem;
        }
        .price-badge {
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
        }
        .btn-detail {
            background: #7c3aed;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-detail:hover {
            background: #5b21b6;
            transform: scale(1.03);
        }
        .event-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.3;
        }
        .event-meta {
            color: #6b7280;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .event-meta .material-symbols-outlined {
            font-size: 1rem;
        }
        .scroll-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .scroll-container::-webkit-scrollbar {
            height: 6px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: #c4b5fd;
            border-radius: 10px;
        }
        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }
        .nav-arrow {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
            z-index: 10;
        }
        .nav-arrow:hover {
            background: #f5f3ff;
            border-color: #7c3aed;
            box-shadow: 0 4px 12px rgba(124,58,237,0.15);
        }
        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .support-link {
            color: #6b7280;
            transition: color 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .support-link:hover {
            color: #7c3aed;
        }
        .footer-text {
            color: #9ca3af;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Header público (sin Admin, con Soporte) -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-bold text-violet-600">Evently</span>
            </div>
            <a href="soporte.html" class="support-link">
                <span class="material-symbols-outlined text-sm">help</span> Soporte
            </a>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Próximos eventos</h1>

        <!-- Contenedor con scroll horizontal y flechas -->
        <div class="relative mt-4">
            <!-- Flecha izquierda -->
            <button id="scrollLeft" class="nav-arrow absolute left-0 top-1/2 -translate-y-1/2 -ml-5 lg:-ml-6 hidden lg:flex">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>

            <!-- Scroll container -->
            <div id="eventosContainer" class="scroll-container">
                <div class="w-full text-center text-gray-400 py-12">Cargando eventos...</div>
            </div>

            <!-- Flecha derecha -->
            <button id="scrollRight" class="nav-arrow absolute right-0 top-1/2 -translate-y-1/2 -mr-5 lg:-mr-6 hidden lg:flex">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center footer-text">
        © 2024 Evently by Bali Group
    </footer>

    <!-- Importar Firebase (módulo) -->
    <script type="module" src="../shared/firebase-init.js"></script>

    <script type="module">
        const container = document.getElementById('eventosContainer');
        const scrollLeftBtn = document.getElementById('scrollLeft');
        const scrollRightBtn = document.getElementById('scrollRight');

        function scrollContainer(direction) {
            const scrollAmount = 300;
            if (direction === 'left') {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        scrollLeftBtn.addEventListener('click', () => scrollContainer('left'));
        scrollRightBtn.addEventListener('click', () => scrollContainer('right'));

        function updateArrows() {
            const isAtStart = container.scrollLeft === 0;
            const isAtEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth - 2;
            scrollLeftBtn.style.display = isAtStart ? 'none' : 'flex';
            scrollRightBtn.style.display = isAtEnd ? 'none' : 'flex';
        }

        container.addEventListener('scroll', updateArrows);

        async function cargarEventos() {
            try {
                const querySnapshot = await getDocs(collection(db, "eventos"));
                const eventos = [];
                querySnapshot.forEach((doc) => {
                    eventos.push({ id: doc.id, ...doc.data() });
                });

                if (eventos.length === 0) {
                    container.innerHTML = `
                        <div class="w-full text-center py-16">
                            <span class="material-symbols-outlined text-6xl text-gray-300">event_busy</span>
                            <p class="text-gray-400 mt-4">No hay eventos disponibles por ahora.</p>
                            <p class="text-sm text-gray-300">Vuelve más tarde.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = eventos.map(evento => {
                    let precio = '';
                    if (evento.lotes && evento.lotes.length > 0) {
                        const p = Number(evento.lotes[0].precio);
                        if (!isNaN(p) && p > 0) {
                            precio = `$${p.toLocaleString()}`;
                        }
                    }
                    const imagen = evento.imagen || './imag/Imagen de evento 1.jpg';

                    let fechaFormateada = evento.fecha || 'Fecha no definida';
                    if (evento.fecha) {
                        try {
                            const partes = evento.fecha.split(' ');
                            if (partes.length === 3) {
                                const meses = { 'Enero':'Ene','Febrero':'Feb','Marzo':'Mar','Abril':'Abr','Mayo':'May','Junio':'Jun','Julio':'Jul','Agosto':'Ago','Septiembre':'Sep','Octubre':'Oct','Noviembre':'Nov','Diciembre':'Dic' };
                                const mesAbr = meses[partes[1]] || partes[1];
                                fechaFormateada = `${partes[0]} ${mesAbr} ${partes[2]}`;
                            }
                        } catch (e) { }
                    }

                    return `
                        <div class="bg-white border border-gray-200 event-card">
                            <div class="event-image">
                                <img src="${imagen}" alt="${evento.nombre}" class="w-full h-full object-cover" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\'material-symbols-outlined text-5xl text-violet-300\'>image</span>'">
                            </div>
                            <div class="p-4">
                                <h3 class="event-title truncate">${evento.nombre || 'Sin nombre'}</h3>
                                <div class="mt-1 space-y-0.5">
                                    <p class="event-meta">
                                        <span class="material-symbols-outlined">calendar_month</span>
                                        <span>${fechaFormateada}</span>
                                    </p>
                                    <p class="event-meta">
                                        <span class="material-symbols-outlined">location_on</span>
                                        <span>${evento.lugar || 'Lugar no definido'}</span>
                                    </p>
                                </div>
                                <div class="mt-3 flex items-center justify-between">
                                    ${precio ? `<span class="price-badge">${precio}</span>` : '<span></span>'}
                                    <a href="evento.html?id=${evento.id}" class="btn-detail text-white px-4 py-1.5 rounded-full shadow-sm hover:shadow-md inline-flex items-center gap-1">
                                        Detalles
                                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                setTimeout(updateArrows, 100);

            } catch (error) {
                console.error('Error al cargar eventos:', error);
                container.innerHTML = `
                    <div class="w-full text-center py-12">
                        <span class="material-symbols-outlined text-5xl text-red-400">error</span>
                        <p class="text-red-500 mt-4">Error al cargar eventos. Intenta nuevamente.</p>
                    </div>
                `;
            }
        }

        cargarEventos();
    </script>
</body>
</html>
