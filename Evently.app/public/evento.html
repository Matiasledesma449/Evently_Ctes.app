<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evently - Detalle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; }
        .lote-option { transition: all 0.2s; cursor: pointer; }
        .lote-option:hover { border-color: #7c3aed; background: #f5f3ff; }
        .lote-option.selected { border-color: #7c3aed; background: #ede9fe; }
        .quantity-btn { width: 36px; height: 36px; border-radius: 9999px; border: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .quantity-btn:hover { background: #f3f4f6; }
        .quantity-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-violet-600 transition">
                    <span class="material-symbols-outlined">arrow_back</span>
                    
                </a>
                <span class="text-xl font-bold text-violet-600">Evently</span>
            </div>
            
        </div>
    </header>

    <!-- Contenido principal -->
    <main id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Cargando... -->
        <div id="loading" class="text-center py-12">
            <span class="material-symbols-outlined text-4xl text-violet-600 animate-pulse">autorenew</span>
            <p class="text-gray-500 mt-2">Cargando evento...</p>
        </div>

        <!-- Contenido del evento (oculto inicialmente) -->
        <div id="eventoContent" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Columna izquierda: Información del evento -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- Imagen y título -->
                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                        <img id="eventoImagen" src="" alt="" class="w-full h-64 object-cover">
                        <div class="p-5">
                            <h1 id="eventoNombre" class="text-2xl font-bold text-gray-800"></h1>
                            <div class="flex flex-wrap gap-3 mt-2 text-sm text-gray-500">
                                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">calendar_today</span> <span id="eventoFecha"></span></span>
                                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">location_on</span> <span id="eventoLugar"></span></span>
                            </div>
                            <p id="eventoDescripcion" class="text-gray-600 text-sm mt-4 leading-relaxed"></p>
                        </div>
                    </div>

                    <!-- Lotes disponibles -->
                    <div class="bg-white rounded-xl border border-gray-200 p-5">
                        <h2 class="font-semibold text-gray-800 mb-4">Lotes disponibles</h2>
                        <div id="lotesContainer" class="space-y-3">
                            <!-- Se llena con JS -->
                        </div>
                    </div>
                </div>

                <!-- Columna derecha: Compra -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-xl border border-gray-200 p-5 sticky top-24">
                        <h3 class="font-semibold text-gray-800 mb-4">Comprar entradas</h3>

                        <!-- Lote seleccionado -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Lote seleccionado</label>
                            <div id="loteSeleccionado" class="text-sm text-gray-500 bg-gray-50 rounded-lg px-3 py-2">Selecciona un lote</div>
                        </div>

                        <!-- Cantidad -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                            <div class="flex items-center gap-3">
                                <button class="quantity-btn" id="qtyMinus" onclick="cambiarCantidad(-1)">−</button>
                                <span id="qtyDisplay" class="text-lg font-semibold w-8 text-center">1</span>
                                <button class="quantity-btn" id="qtyPlus" onclick="cambiarCantidad(1)">+</button>
                            </div>
                            <p id="stockMsg" class="text-xs text-gray-400 mt-1"></p>
                        </div>

                        <!-- Correo -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                            <input type="email" id="emailInput" placeholder="tucorreo@ejemplo.com" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none text-sm">
                        </div>

                        <!-- Método de pago -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Método de pago</label>
                            <select id="metodoPago" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none text-sm">
                                <option value="">Selecciona un método</option>
                            </select>
                        </div>

                        <!-- Total -->
                        <div class="border-t border-gray-200 pt-4 mt-4">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Total</span>
                                <span id="totalDisplay" class="text-xl font-bold text-violet-600">$0</span>
                            </div>
                        </div>

                        <!-- Botón comprar -->
                        <button id="btnComprar" onclick="procesarCompra()" class="w-full mt-4 bg-violet-600 hover:bg-violet-700 text-white font-semibold py-3 rounded-full transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            Comprar ahora
                        </button>
                        <p class="text-xs text-center text-gray-400 mt-2">Aceptamos todos los métodos de pago</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/data.js"></script>
    <script>
        // Estado de la compra
        let estado = {
            evento: null,
            loteSeleccionado: null,
            cantidad: 1,
            email: '',
            metodoPago: ''
        };

        // Leer ID de la URL
        const params = new URLSearchParams(window.location.search);
        const eventoId = params.get('id');

        // Si no hay ID, redirigir al listado
        if (!eventoId) {
            window.location.href = 'index.html';
        }

        // Cargar evento
        const evento = getEventoById(eventoId);
        if (!evento) {
            document.getElementById('loading').innerHTML = `
                <span class="material-symbols-outlined text-4xl text-red-400">error</span>
                <p class="text-gray-500 mt-2">Evento no encontrado</p>
                <a href="index.html" class="text-violet-600 hover:underline text-sm mt-2 inline-block">Volver al listado</a>
            `;
            throw new Error('Evento no encontrado');
        }

        estado.evento = evento;

        // Mostrar información del evento
        document.getElementById('eventoImagen').src = evento.imagen;
        document.getElementById('eventoImagen').alt = evento.nombre;
        document.getElementById('eventoNombre').textContent = evento.nombre;
        document.getElementById('eventoFecha').textContent = evento.fecha;
        document.getElementById('eventoLugar').textContent = evento.lugar;
        document.getElementById('eventoDescripcion').textContent = evento.descripcion;

        // Renderizar lotes
        const lotesContainer = document.getElementById('lotesContainer');
        evento.lotes.forEach((lote, index) => {
            const div = document.createElement('div');
            div.className = `lote-option border border-gray-200 rounded-xl p-3 ${index === 0 ? 'selected' : ''}`;
            if (index === 0) estado.loteSeleccionado = lote;
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-medium text-gray-800">${lote.nombre}</p>
                        <p class="text-xs text-gray-400">${lote.vigencia} • ${lote.disponibles - lote.vendidas} disponibles</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-violet-600">$${lote.precio.toLocaleString()}</p>
                        <p class="text-xs text-gray-400">por entrada</p>
                    </div>
                </div>
            `;
            div.addEventListener('click', function() {
                document.querySelectorAll('.lote-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                estado.loteSeleccionado = lote;
                actualizarResumen();
            });
            lotesContainer.appendChild(div);
        });

        // Métodos de pago
        const metodoSelect = document.getElementById('metodoPago');
        evento.metodosPago.forEach(m => {
            const option = document.createElement('option');
            option.value = m;
            option.textContent = m;
            metodoSelect.appendChild(option);
        });

        // Actualizar resumen
        function actualizarResumen() {
            const lote = estado.loteSeleccionado;
            const cantidad = estado.cantidad;
            if (lote) {
                document.getElementById('loteSeleccionado').textContent = `${lote.nombre} - $${lote.precio.toLocaleString()} c/u`;
                const total = lote.precio * cantidad;
                document.getElementById('totalDisplay').textContent = `$${total.toLocaleString()}`;
                const disponibles = lote.disponibles - lote.vendidas;
                document.getElementById('stockMsg').textContent = `${disponibles} entradas disponibles`;
                // Habilitar botón si hay stock
                document.getElementById('btnComprar').disabled = (disponibles < cantidad);
            } else {
                document.getElementById('loteSeleccionado').textContent = 'Selecciona un lote';
                document.getElementById('totalDisplay').textContent = '$0';
                document.getElementById('btnComprar').disabled = true;
            }
            // Validar email y método
            const email = document.getElementById('emailInput').value.trim();
            const metodo = document.getElementById('metodoPago').value;
            estado.email = email;
            estado.metodoPago = metodo;
            // El botón se habilita si todo está completo y hay stock
            const stockOk = estado.loteSeleccionado && (estado.loteSeleccionado.disponibles - estado.loteSeleccionado.vendidas) >= estado.cantidad;
            document.getElementById('btnComprar').disabled = !(stockOk && email && metodo);
        }

        // Cambiar cantidad
        function cambiarCantidad(delta) {
            const newQty = estado.cantidad + delta;
            if (newQty < 1) return;
            if (estado.loteSeleccionado) {
                const max = estado.loteSeleccionado.disponibles - estado.loteSeleccionado.vendidas;
                if (newQty > max) return;
            }
            estado.cantidad = newQty;
            document.getElementById('qtyDisplay').textContent = newQty;
            actualizarResumen();
        }

        // Eventos de cambio
        document.getElementById('emailInput').addEventListener('input', actualizarResumen);
        document.getElementById('metodoPago').addEventListener('change', actualizarResumen);

        // Procesar compra
        function procesarCompra() {
            const lote = estado.loteSeleccionado;
            const cantidad = estado.cantidad;
            const email = estado.email;
            const metodo = estado.metodoPago;
            const total = lote.precio * cantidad;

            if (!lote || !email || !metodo) {
                alert('Completa todos los campos.');
                return;
            }

            // Simular compra (aquí iría la integración con Mercado Pago)
            // Generar un ID de compra aleatorio
            const compraId = 'CMP-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

            // Guardar datos de la compra en sessionStorage para la confirmación
            const compraData = {
                id: compraId,
                eventoId: evento.id,
                eventoNombre: evento.nombre,
                loteNombre: lote.nombre,
                cantidad: cantidad,
                precioUnitario: lote.precio,
                total: total,
                email: email,
                metodo: metodo,
                fecha: new Date().toLocaleString()
            };
            sessionStorage.setItem('compraActual', JSON.stringify(compraData));

            // Redirigir a confirmación
            window.location.href = `confirmacion.html?id=${compraId}`;
        }

        // Inicializar
        actualizarResumen();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('eventoContent').classList.remove('hidden');
    </script>
</body>
</html>
