<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evently - Confirmación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- QRCode.js para generar QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; }
        .success-card { animation: fadeUp 0.6s ease forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .qr-container { background: white; padding: 16px; border-radius: 12px; display: inline-block; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-violet-600 transition">
                    <span class="material-symbols-outlined">arrow_back</span>
                    
                </a>
                <span class="text-xl font-bold text-violet-600">Evently</span>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="loading" class="text-center py-12">
            <span class="material-symbols-outlined text-4xl text-violet-600 animate-spin">autorenew</span>
            <p class="text-gray-500 mt-2">Cargando compra...</p>
        </div>

        <div id="confirmacionContent" class="hidden success-card">
            <!-- Banner de éxito -->
            <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-center mb-6">
                <div class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center mx-auto">
                    <span class="material-symbols-outlined text-white text-3xl">check_circle</span>
                </div>
                <h1 class="text-2xl font-bold text-green-700 mt-3">¡Compra confirmada!</h1>
                <p class="text-green-600 text-sm">Tu entrada ha sido generada correctamente.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Columna izquierda: QR y detalles -->
                <div>
                    <div class="bg-white rounded-xl border border-gray-200 p-5 text-center">
                        <h3 class="font-medium text-gray-700 mb-3">Escanea para ingresar</h3>
                        <div id="qrCodeContainer" class="qr-container inline-block"></div>
                        <p class="text-xs text-gray-400 mt-3">Presenta este QR en la entrada del evento</p>
                        <button onclick="window.print()" class="mt-3 text-sm text-violet-600 hover:text-violet-800 transition flex items-center gap-1 justify-center">
                            <span class="material-symbols-outlined text-sm">download</span> Descargar / Imprimir
                        </button>
                    </div>
                </div>

                <!-- Columna derecha: Resumen de compra -->
                <div>
                    <div class="bg-white rounded-xl border border-gray-200 p-5">
                        <h3 class="font-semibold text-gray-800 mb-4">Resumen de compra</h3>
                        <div id="resumenCompra">
                            <!-- Se llena con JS -->
                        </div>
                        <div class="border-t border-gray-200 pt-4 mt-4">
                            <button onclick="enviarCorreo()" class="w-full bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium py-3 rounded-full transition flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined text-sm">email</span>
                                Reenviar QR al correo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Leer ID de compra de la URL o sessionStorage
        const params = new URLSearchParams(window.location.search);
        let compraId = params.get('id');

        // Si no viene en URL, buscar en sessionStorage
        let compraData = null;
        try {
            const stored = sessionStorage.getItem('compraActual');
            if (stored) {
                compraData = JSON.parse(stored);
                if (!compraId) compraId = compraData.id;
            }
        } catch (e) {}

        if (!compraData) {
            // Si no hay datos, mostrar error
            document.getElementById('loading').innerHTML = `
                <span class="material-symbols-outlined text-4xl text-red-400">error</span>
                <p class="text-gray-500 mt-2">No se encontró información de la compra.</p>
                <a href="index.html" class="text-violet-600 hover:underline text-sm mt-2 inline-block">Volver al inicio</a>
            `;
            throw new Error('No hay datos de compra');
        }

        // Mostrar resumen
        const resumenDiv = document.getElementById('resumenCompra');
        resumenDiv.innerHTML = `
            <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-gray-500">Evento</span><span class="font-medium">${compraData.eventoNombre}</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Lote</span><span>${compraData.loteNombre}</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Cantidad</span><span>${compraData.cantidad}</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Precio unitario</span><span>$${compraData.precioUnitario.toLocaleString()}</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Método de pago</span><span>${compraData.metodo}</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Correo</span><span class="truncate">${compraData.email}</span></div>
                <div class="flex justify-between border-t border-gray-200 pt-2 mt-2 font-bold text-violet-600">
                    <span>Total</span>
                    <span>$${compraData.total.toLocaleString()}</span>
                </div>
            </div>
        `;

        // Generar QR con el ID de compra (o con los datos)
        const qrContainer = document.getElementById('qrCodeContainer');
        // El QR contendrá un JSON con los datos relevantes para validar la entrada
        const qrData = JSON.stringify({
            compraId: compraData.id,
            eventoId: compraData.eventoId,
            email: compraData.email,
            cantidad: compraData.cantidad
        });
        new QRCode(qrContainer, {
            text: qrData,
            width: 180,
            height: 180,
            colorDark: '#1a1c1c',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        // Ocultar loading y mostrar contenido
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('confirmacionContent').classList.remove('hidden');

        // Función para reenviar correo (simulado)
        function enviarCorreo() {
            alert(`📧 Se ha reenviado el QR al correo: ${compraData.email}\n(ID de compra: ${compraData.id})`);
            // Aquí iría la llamada real a tu backend para reenviar el correo con el QR
        }
    </script>
</body>
</html>
