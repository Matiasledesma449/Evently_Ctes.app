<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Evently - Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        /* 👇 CAMBIO PRINCIPAL: body con flex column y min-height */
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f6f5fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        /* 👇 main ocupa el espacio restante para empujar el footer abajo */
        main {
            flex: 1;
        }

        .event-card {
            overflow: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px -16px rgba(31, 41, 55, 0.38);
            border-color: #c4b5fd;
        }
        .event-image {
            aspect-ratio: 12 / 5; /* banner horizontal, como las carteleras grandes (ideal: 1600 x 670) */
            background: #f3f0ff;
            position: relative;
            overflow: hidden;
        }
        .event-image img { transition: transform 0.35s ease; }
        .event-card:hover .event-image img { transform: scale(1.035); }
        .event-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
        }
        .hero-frame {
            min-height: 330px;
            height: 420px;
            isolation: isolate;
            background: #27243a;
        }
        .hero-media, .hero-image, .hero-shade { position: absolute; inset: 0; }
        .hero-image { width: 100%; height: 100%; object-fit: cover; }
        .hero-shade { background: rgba(17, 24, 39, 0.58); z-index: 1; }
        .hero-content { animation: hero-reveal 0.38s ease both; }
        .hero-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
        }
        [hidden] { display: none !important; }
        .hero-dot { width: 8px; height: 8px; border-radius: 9999px; background: #d1d5db; transition: width 0.2s, background 0.2s; }
        .hero-dot[aria-current="true"] { width: 24px; background: #7c3aed; }
        .fade-in { animation: card-reveal 0.45s ease both; }
        @keyframes hero-reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes card-reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
        .price-badge {
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
        }
        .btn-detail {
            background: #7c3aed;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn-detail:hover {
            background: #5b21b6;
            transform: scale(1.03);
        }
        .event-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.3;
        }
        .event-meta {
            color: #6b7280;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .event-meta .material-symbols-outlined {
            font-size: 1rem;
        }
        .nav-arrow {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 9999px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
            z-index: 10;
        }
        .nav-arrow:hover {
            background: #f5f3ff;
            border-color: #7c3aed;
            box-shadow: 0 4px 12px rgba(124,58,237,0.15);
        }
        .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
        .footer-text {
            color: #9ca3af;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Cabecera común: la dibuja shared/cabecera-publica.js (logo, Inicio y Eventos) -->
    <header id="cabecera" class="bg-white border-b border-[#e7e3f0] sticky top-0 z-50 h-16"></header>

    <!-- Contenido principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 sm:py-8 w-full">
        <section aria-labelledby="tituloDestacados">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2 mb-4">
                <div>
                    <h1 id="tituloDestacados" class="text-2xl font-bold text-gray-900 mt-1">Encontrá tu próximo evento</h1>
                </div>
                <p class="text-sm text-gray-500">Experiencias para compartir, cerca y más adelante.</p>
            </div>

            <div id="heroCarousel" class="relative" aria-roledescription="carrusel" aria-label="Eventos destacados" hidden>
                <div class="hero-frame relative overflow-hidden rounded-xl">
                    <div class="hero-media" aria-hidden="true">
                        <img id="heroImage" class="hero-image" alt="" />
                        <div id="heroPlaceholder" class="hero-placeholder" hidden>
                            <span class="material-symbols-outlined text-7xl">event</span>
                        </div>
                        <div class="hero-shade"></div>
                    </div>
                    <div id="heroContent" class="hero-content absolute inset-0 z-10 flex flex-col justify-end items-start p-6 sm:p-10 text-white">
                        <p id="heroBadge" class="text-sm font-semibold mb-2 bg-white/15 backdrop-blur px-3 py-1 rounded-full">Destacado</p>
                        <h2 id="heroTitle" class="text-2xl sm:text-4xl font-bold max-w-2xl"></h2>
                        <div class="flex flex-wrap gap-x-5 gap-y-2 mt-3 text-sm text-white/90">
                            <p class="flex items-center gap-1.5"><span class="material-symbols-outlined text-base">calendar_month</span><span id="heroDate"></span></p>
                            <p class="flex items-center gap-1.5"><span class="material-symbols-outlined text-base">location_on</span><span id="heroPlace"></span></p>
                        </div>
                        <a id="heroLink" href="#" class="inline-flex items-center gap-2 bg-violet-600 hover:bg-violet-700 text-white font-semibold px-5 py-3 rounded-lg mt-5 transition shadow-sm">
                            Ver evento <span class="material-symbols-outlined text-base">arrow_forward</span>
                        </a>
                    </div>
                    <button id="heroAnterior" type="button" aria-label="Evento destacado anterior" class="nav-arrow absolute right-16 top-3 sm:right-auto sm:left-3 sm:top-1/2 sm:-translate-y-1/2 z-20">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button id="heroSiguiente" type="button" aria-label="Siguiente evento destacado" class="nav-arrow absolute right-3 top-3 sm:top-1/2 sm:-translate-y-1/2 z-20">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
                <div id="heroDots" class="flex justify-center items-center gap-2 py-4" aria-label="Seleccionar evento destacado"></div>
            </div>
        </section>

        <section id="eventos" class="mt-5 sm:mt-8 scroll-mt-20" aria-labelledby="tituloEventos">
            <div class="flex items-end justify-between gap-3 mb-4">
                <div>
                    <h2 id="tituloEventos" class="text-xl font-bold text-gray-900">Todos los eventos</h2>
                    <p class="text-sm text-gray-500 mt-1">Elegí tu próxima salida.</p>
                </div>
            </div>
            <div id="eventosContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p class="text-gray-400 py-10 text-center col-span-full">Cargando eventos...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="pie" class="bg-white border-t border-gray-200 py-4 text-center footer-text"></footer>

    <!-- Importar Firebase (módulo) -->
    <script type="module" src="../shared/firebase-init.js"></script>

    <script type="module">
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { imagenDelEvento } from "../shared/imagen-evento.js";
        import { lugarCorto } from "../shared/evento-datos.js";
        import { estadoDeVentaDelEvento, hoyEnArgentina, diaMes } from "../shared/lotes.js";
        import { dibujarPie } from "../shared/pie-publico.js";
        import { dibujarCabecera } from "../shared/cabecera-publica.js";

        dibujarPie(document.getElementById('pie'), 'inicio');
        dibujarCabecera(document.getElementById('cabecera'), 'inicio');

        const db = window.db;
        const container = document.getElementById('eventosContainer');
        const heroCarousel = document.getElementById('heroCarousel');
        const heroImage = document.getElementById('heroImage');
        const heroPlaceholder = document.getElementById('heroPlaceholder');
        const heroContent = document.getElementById('heroContent');
        const heroDots = document.getElementById('heroDots');
        const heroAnterior = document.getElementById('heroAnterior');
        const heroSiguiente = document.getElementById('heroSiguiente');
        let eventosDestacados = [];
        let indiceDestacado = 0;
        let temporizadorCarrusel = null;

        const meses = {
            enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5,
            julio: 6, agosto: 7, septiembre: 8, octubre: 9, noviembre: 10, diciembre: 11
        };

        function fechaEvento(valor) {
            if (valor && typeof valor.toDate === 'function') return valor.toDate();
            if (valor instanceof Date) return valor;
            if (typeof valor !== 'string') return null;

            const fechaIso = valor.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (fechaIso) return new Date(Number(fechaIso[1]), Number(fechaIso[2]) - 1, Number(fechaIso[3]));

            const fechaLocal = valor.match(/^(\d{1,2})\s+([a-záéíóúñ]+)\s+(\d{4})$/i);
            if (fechaLocal) {
                const mes = fechaLocal[2].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
                if (meses[mes] !== undefined) return new Date(Number(fechaLocal[3]), meses[mes], Number(fechaLocal[1]));
            }

            const fechaNumerica = valor.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
            if (fechaNumerica) return new Date(Number(fechaNumerica[3]), Number(fechaNumerica[2]) - 1, Number(fechaNumerica[1]));

            const timestamp = Date.parse(valor);
            return Number.isNaN(timestamp) ? null : new Date(timestamp);
        }

        function inicioDelDia(fecha) {
            return new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
        }

        function fechaLegible(evento) {
            const fecha = fechaEvento(evento.fecha);
            return fecha
                ? fecha.toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' })
                : evento.fecha || 'Fecha por confirmar';
        }

        function etiquetaProximidad(evento) {
            const fecha = fechaEvento(evento.fecha);
            if (!fecha) return '';
            const dias = Math.ceil((inicioDelDia(fecha) - inicioDelDia(new Date())) / 86400000);
            if (dias < 0) return '';
            if (dias <= 3) return 'Últimos días';
            if (dias <= 14) return 'Próximo';
            return '';
        }

        // La foto del evento; si no tiene (o no carga) se ve su relleno propio: letra inicial sobre un violeta, distinto por evento
        function configurarImagen(img, placeholder, evento, alt) {
            const { src, relleno } = imagenDelEvento(evento);
            // En el destacado hay una capa oscura encima: ahí el fondo es el violeta fuerte y la letra queda clara
            const enDestacado = placeholder.id === 'heroPlaceholder';
            placeholder.style.background = enDestacado ? relleno.texto : relleno.fondo;
            placeholder.style.color = enDestacado ? 'rgba(255,255,255,0.4)' : relleno.texto;
            const letra = document.createElement('span');
            letra.className = 'font-bold select-none';
            letra.style.fontSize = '4rem';
            letra.style.lineHeight = '1';
            letra.textContent = relleno.letra;
            placeholder.replaceChildren(letra);
            placeholder.dataset.imagenEvento = `relleno:${relleno.letra}:${relleno.fondo}`;
            img.alt = alt;
            img.onerror = () => {
                img.hidden = true;
                placeholder.hidden = false;
            };
            if (!src) {
                img.removeAttribute('src');
                img.hidden = true;
                placeholder.hidden = false;
                img.dataset.imagenEvento = '';
                return;
            }
            img.hidden = false;
            placeholder.hidden = true;
            img.dataset.imagenEvento = src;
            img.src = src;
        }

        function crearIcono(nombre, clases = '') {
            const icono = document.createElement('span');
            icono.className = `material-symbols-outlined ${clases}`.trim();
            icono.textContent = nombre;
            return icono;
        }

        // Cómo está la venta (pedido de la persona: que se vea si se agotó o si terminó la venta online)
        const AVISO_DE_VENTA = {
            agotado: { texto: 'Agotado', clase: 'bg-red-600 text-white' },
            terminada: { texto: 'Venta finalizada', clase: 'bg-gray-900/85 text-white' },
            proximamente: { texto: 'Próximamente', clase: 'bg-amber-400 text-amber-950' },
        };

        // El precio más bajo entre los lotes (con "Desde" si hay más de uno con precio)
        function textoDePrecio(evento) {
            const precios = (Array.isArray(evento.lotes) ? evento.lotes : []).map((l) => Number(l && l.precio)).filter((n) => Number.isFinite(n) && n > 0);
            if (!precios.length) return '';
            const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Math.min(...precios));
            return precios.length > 1 ? `Desde ${pesos}` : pesos;
        }

        // Tarjeta ancha (banner arriba, datos abajo). El cuerpo crece para que el botón quede siempre a la misma altura.
        function crearCardEvento(evento, indice) {
            const card = document.createElement('article');
            card.className = 'event-card fade-in bg-white border border-gray-200';
            card.style.animationDelay = `${Math.min(indice * 55, 330)}ms`;

            const frame = document.createElement('div');
            frame.className = 'event-image';
            const img = document.createElement('img');
            img.className = 'w-full h-full object-cover';
            img.loading = 'lazy';
            img.decoding = 'async';
            const placeholder = document.createElement('div');
            placeholder.className = 'event-placeholder';
            placeholder.hidden = true;
            placeholder.appendChild(crearIcono('image', 'text-5xl'));
            configurarImagen(img, placeholder, evento, evento.nombre || 'Imagen del evento');
            frame.append(img, placeholder);

            const venta = estadoDeVentaDelEvento(evento.lotes, hoyEnArgentina());
            const aviso = AVISO_DE_VENTA[venta.estado];
            const badgeText = aviso ? aviso.texto : etiquetaProximidad(evento);
            if (badgeText) {
                const badge = document.createElement('span');
                badge.className = 'absolute top-3 left-3 text-xs font-bold px-3 py-1 rounded-full shadow-sm ' + (aviso ? aviso.clase : 'bg-white/95 text-violet-800');
                badge.textContent = badgeText;
                frame.appendChild(badge);
            }

            const body = document.createElement('div');
            body.className = 'p-5 flex flex-col flex-1';
            const title = document.createElement('h3');
            title.className = 'text-lg font-bold leading-snug text-gray-900 truncate';
            title.textContent = evento.nombre || 'Sin nombre';
            title.title = evento.nombre || '';

            const details = document.createElement('div');
            details.className = 'mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 min-w-0';
            const dateRow = document.createElement('p');
            dateRow.className = 'event-meta whitespace-nowrap';
            dateRow.append(crearIcono('calendar_month'), document.createTextNode(fechaLegible(evento)));
            const placeRow = document.createElement('p');
            placeRow.className = 'event-meta min-w-0 max-w-full';
            const lugar = document.createElement('span');
            lugar.className = 'truncate';
            lugar.textContent = lugarCorto(evento.lugar) || 'Lugar a confirmar';
            lugar.title = evento.lugar || '';
            placeRow.append(crearIcono('location_on'), lugar);
            details.append(dateRow, placeRow);

            const actions = document.createElement('div');
            actions.className = 'mt-auto pt-4 flex items-center justify-between gap-3';
            const price = document.createElement('span');
            price.className = 'text-base font-bold text-gray-900';
            price.textContent = venta.estado === 'agotado' ? 'Entradas agotadas'
                : venta.estado === 'terminada' ? 'Venta online cerrada'
                : venta.estado === 'proximamente' && venta.desde ? `A la venta el ${diaMes(venta.desde)}`
                : textoDePrecio(evento);
            if (aviso) price.className = 'text-sm font-semibold text-gray-500';
            actions.appendChild(price);

            const link = document.createElement('a');
            link.href = `evento.html?id=${encodeURIComponent(evento.id)}`;
            link.className = 'btn-detail shrink-0 text-white px-5 py-2.5 rounded-full shadow-sm hover:shadow-md inline-flex items-center gap-2 font-semibold';
            link.append(aviso ? 'Ver evento' : 'Ver entradas', crearIcono('arrow_forward', 'text-base'));
            actions.appendChild(link);

            body.append(title, details, actions);
            card.append(frame, body);
            return card;
        }

        function renderizarGrilla(eventos) {
            container.replaceChildren();
            if (eventos.length === 0) {
                const vacio = document.createElement('div');
                vacio.className = 'col-span-full text-center py-14';
                vacio.appendChild(crearIcono('event_busy', 'text-5xl text-gray-300'));
                const mensaje = document.createElement('p');
                mensaje.className = 'text-gray-500 mt-3';
                mensaje.textContent = 'No hay eventos disponibles por ahora.';
                vacio.appendChild(mensaje);
                container.appendChild(vacio);
                return;
            }
            eventos.forEach((evento, indice) => container.appendChild(crearCardEvento(evento, indice)));
        }

        function renderizarDestacado() {
            if (eventosDestacados.length === 0) return;
            const evento = eventosDestacados[indiceDestacado];
            heroContent.classList.remove('hero-content');
            void heroContent.offsetWidth;
            heroContent.classList.add('hero-content');

            configurarImagen(heroImage, heroPlaceholder, evento, evento.nombre || 'Evento destacado');
            document.getElementById('heroTitle').textContent = evento.nombre || 'Evento destacado';
            document.getElementById('heroDate').textContent = fechaLegible(evento);
            document.getElementById('heroPlace').textContent = lugarCorto(evento.lugar) || 'Lugar a confirmar';
            document.getElementById('heroLink').href = `evento.html?id=${encodeURIComponent(evento.id)}`;
            document.getElementById('heroBadge').textContent = etiquetaProximidad(evento) || 'Eventos destacados';
            heroAnterior.hidden = eventosDestacados.length < 2;
            heroSiguiente.hidden = eventosDestacados.length < 2;
            heroDots.replaceChildren();

            eventosDestacados.forEach((item, indice) => {
                const punto = document.createElement('button');
                punto.type = 'button';
                punto.className = 'hero-dot';
                punto.setAttribute('aria-label', `Mostrar ${item.nombre || 'evento'} destacado`);
                punto.setAttribute('aria-current', String(indice === indiceDestacado));
                punto.addEventListener('click', () => {
                    indiceDestacado = indice;
                    renderizarDestacado();
                    reiniciarCarrusel();
                });
                heroDots.appendChild(punto);
            });
        }

        function moverDestacado(direccion) {
            if (eventosDestacados.length < 2) return;
            indiceDestacado = (indiceDestacado + direccion + eventosDestacados.length) % eventosDestacados.length;
            renderizarDestacado();
            reiniciarCarrusel();
        }

        function reiniciarCarrusel() {
            window.clearInterval(temporizadorCarrusel);
            if (eventosDestacados.length > 1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                temporizadorCarrusel = window.setInterval(() => moverDestacado(1), 5000);
            }
        }

        heroAnterior.addEventListener('click', () => moverDestacado(-1));
        heroSiguiente.addEventListener('click', () => moverDestacado(1));

        async function cargarEventos() {
            try {
                const eventosPublicados = query(collection(db, 'eventos'), where('estado', '==', 'publicado'));
                const querySnapshot = await getDocs(eventosPublicados);
                const todos = querySnapshot.docs
                    .map(documento => ({ id: documento.id, ...documento.data() }))
                    .filter(evento => evento.activo !== false && evento.eliminado !== true); // sin suspendidos ni eliminados

                const hoy = inicioDelDia(new Date());
                const eventos = todos
                    .filter(evento => !fechaEvento(evento.fecha) || inicioDelDia(fechaEvento(evento.fecha)) >= hoy)
                    .sort((a, b) => {
                        const fechaA = fechaEvento(a.fecha)?.getTime() ?? Number.MAX_SAFE_INTEGER;
                        const fechaB = fechaEvento(b.fecha)?.getTime() ?? Number.MAX_SAFE_INTEGER;
                        return fechaA - fechaB;
                    });

                eventosDestacados = eventos.slice(0, 3);
                heroCarousel.hidden = eventosDestacados.length === 0;
                if (eventosDestacados.length) {
                    renderizarDestacado();
                    reiniciarCarrusel();
                }
                renderizarGrilla(eventos);
            } catch (error) {
                console.error('Error al cargar eventos:', error);
                container.replaceChildren();
                const errorMsg = document.createElement('p');
                errorMsg.className = 'col-span-full text-center text-red-600 py-10';
                errorMsg.textContent = 'Error al cargar eventos. Intenta nuevamente.';
                container.appendChild(errorMsg);
                heroCarousel.hidden = true;
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) window.clearInterval(temporizadorCarrusel);
            else reiniciarCarrusel();
        });

        cargarEventos();
    </script>
</body>
</html>
