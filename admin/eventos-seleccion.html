<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evently - Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; }
        .active-link { background: #ede9fe; color: #7c3aed; border-left: 4px solid #7c3aed; }
        .hover-card { transition: box-shadow 0.2s, transform 0.2s; }
        .hover-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
    </style>
    <link rel="stylesheet" href="../shared/admin-shell.css" />
    <link rel="prefetch" href="dashboard.html" />
    <link rel="prefetch" href="eventos.html" />
    <link rel="prefetch" href="consultas-publicas.html" />
</head>
<body>

    <!-- Verificar autenticación -->
    <script type="module" src="../shared/firebase-init.js"></script>
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });
    </script>

    <div class="flex min-h-screen">
        <!-- Menú compartido del panel: lo dibuja shared/menu-admin.js (escritorio y celular) -->
        <script src="../shared/menu-admin.js" data-pagina="eventos-seleccion"></script>

        <!-- Contenido principal -->
        <main class="flex-1 p-6 pb-24 lg:pb-6 overflow-y-auto">

            <!-- Header -->
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6">
                <div>
                    <h1 id="tituloPagina" class="text-2xl font-bold text-gray-800">Eventos</h1>
                    <p id="subtituloPagina" class="text-sm text-gray-500"></p>
                </div>
                <div id="filtrosContainer" class="flex flex-wrap gap-2 items-center">
                    
                    <!-- Boton de Solicitar Evento (Oculto por defecto, se muestra para clientes) -->
                    <a href="eventos.html" id="btnSolicitarEventoCliente" class="hidden bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1 shadow-sm mr-2">
                        <span class="material-symbols-outlined text-sm">add</span> Solicitar evento
                    </a>

                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                        <input id="searchInput" type="text" placeholder="Buscar evento..." class="w-48 sm:w-64 pl-10 pr-3 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none">
                    </div>
                    
                    <!-- Filtro por organización (solo superadmin) -->
                    <select id="organizacionFilter" aria-label="Filtrar por organización" class="hidden border border-gray-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-violet-500 outline-none">
                        <option value="todas">Todas las organizaciones</option>
                    </select>

                    <!-- Filtros ajustados -->
                    <select id="estadoFilter" class="border border-gray-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-violet-500 outline-none">
                        <option value="todos">Todos</option>
                        <option value="publicado">Publicados</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="rechazada">Rechazados</option>
                    </select>
                </div>
            </div>

            <!-- Costo de servicio (solo superadmin): categorías de porcentaje que se asignan a cada evento -->
            <section id="panelServicio" class="hidden mb-8 bg-white rounded-xl border border-gray-200 p-5" aria-labelledby="tituloServicio">
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2 mb-4">
                    <div>
                        <h2 id="tituloServicio" class="text-lg font-bold text-gray-800">Costo de servicio</h2>
                        <p class="text-sm text-gray-500">Lo paga quien compra y se muestra aparte del precio de la entrada. Creá categorías con su porcentaje y asignale una a cada evento. Un evento sin categoría no cobra costo de servicio (0%).</p>
                    </div>
                </div>
                <div id="listaCategorias" class="space-y-2"></div>
                <form id="formNuevaCategoria" class="flex flex-col sm:flex-row gap-2 mt-4 pt-4 border-t border-gray-100" novalidate>
                    <input id="nuevaCategoriaNombre" type="text" maxlength="40" aria-label="Nombre de la categoría nueva" placeholder="Nombre de la categoría (ej: Estándar)" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-violet-500 outline-none">
                    <input id="nuevaCategoriaPorcentaje" type="text" inputmode="decimal" maxlength="6" aria-label="Porcentaje de la categoría nueva" placeholder="Porcentaje (ej: 8)" class="sm:w-40 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-violet-500 outline-none">
                    <button type="submit" class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Agregar categoría</button>
                </form>
                <p id="mensajeServicio" role="status" class="hidden mt-3 text-sm"></p>
            </section>

            <!-- Contenedor dinámico -->
            <div id="contenidoContainer">
                <p class="text-center text-gray-400 py-12">Cargando...</p>
            </div>
        </main>
    </div>


    <!-- Firebase y lógica -->
    <script type="module" src="../shared/firebase-init.js"></script>
    <script type="module">
        import { onSnapshot, collection, doc, getDoc, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { htmlDeImagenEvento } from "../shared/imagen-evento.js";
        import { escaparHtml } from "../shared/ventas-utils.js";
        import { ultimoComentario } from "../shared/solicitudes-evento.js";
        import { validarCategoria, categoriasOrdenadas, nuevoIdDeCategoria, textoDePorcentaje } from "../shared/categorias-comision.js";
        import { mostrarToast } from "../shared/ui-utils.js";

        const contenidoContainer = document.getElementById('contenidoContainer');
        const searchInput = document.getElementById('searchInput');
        const estadoFilter = document.getElementById('estadoFilter');
        const filtrosContainer = document.getElementById('filtrosContainer');
        const tituloPagina = document.getElementById('tituloPagina');
        const subtituloPagina = document.getElementById('subtituloPagina');
        const organizacionFilter = document.getElementById('organizacionFilter');
        const btnSolicitarEventoCliente = document.getElementById('btnSolicitarEventoCliente');

        // Estado
        let miUsuario = null;
        let soySuperAdmin = false;
        let organizaciones = [];
        let eventos = [];
        let solicitudes = []; // Nuevo array para peticiones en limbo
        let categorias = []; // Categorías de costo de servicio (solo las lee el superadmin)
        const panelServicio = document.getElementById('panelServicio');
        const listaCategorias = document.getElementById('listaCategorias');
        const formNuevaCategoria = document.getElementById('formNuevaCategoria');
        const mensajeServicio = document.getElementById('mensajeServicio');
        const DOC_COMISIONES = () => doc(db, 'configuracion', 'comisiones');

        // ✅ Restaurar filtro de estado guardado
        (function restaurarFiltroEstado() {
            const filtroGuardado = localStorage.getItem('eventoEstadoFilter');
            if (filtroGuardado) {
                estadoFilter.value = filtroGuardado;
            }
        })();

        // =====================================================
        // INICIAR
        // =====================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) return;

            const userDoc = await getDoc(doc(db, "usuarios", user.uid));
            if (userDoc.exists()) {
                miUsuario = userDoc.data();
                soySuperAdmin = miUsuario.rol === 'superadmin';
            }

            if (soySuperAdmin) {
                // El superadmin ve los eventos de todas las organizaciones directamente
                tituloPagina.textContent = 'Eventos';
                subtituloPagina.textContent = 'Todos los eventos de todas las organizaciones';
                filtrosContainer.classList.remove('hidden');
                organizacionFilter.classList.remove('hidden');
                panelServicio.classList.remove('hidden');
                cargarCategorias();
                cargarOrganizaciones();
            } else {
                tituloPagina.textContent = 'Eventos';
                subtituloPagina.textContent = 'Todos tus eventos';
                filtrosContainer.classList.remove('hidden');
                btnSolicitarEventoCliente.classList.remove('hidden'); // Mostrar botón al cliente
                cargarEventos();
            }
        });

        // =====================================================
        // SUPERADMIN: CATEGORÍAS DE COSTO DE SERVICIO
        // Se guardan en configuracion/comisiones. Se crean y se editan, no se borran.
        // =====================================================
        function avisoServicio(texto, esError) {
            mensajeServicio.textContent = texto; // textContent: nunca se interpreta como HTML
            mensajeServicio.className = `mt-3 text-sm ${esError ? 'text-red-600' : 'text-green-700'}`;
        }

        function cargarCategorias() {
            onSnapshot(DOC_COMISIONES(), (snap) => {
                categorias = categoriasOrdenadas(snap.exists() ? snap.data() : null);
                dibujarCategorias();
                renderizarVista(); // los selectores de cada evento usan estas categorías
            }, (error) => {
                console.error('No se pudieron leer las categorías:', error);
                avisoServicio('No se pudieron leer las categorías de costo de servicio.', true);
            });
        }

        function crearCampoCategoria(valor, etiqueta, clases, extra = {}) {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = valor;
            input.setAttribute('aria-label', etiqueta);
            input.className = `border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-violet-500 outline-none ${clases}`;
            Object.entries(extra).forEach(([k, v]) => input.setAttribute(k, v));
            return input;
        }

        // Una fila por categoría, armada con textContent/value (el nombre lo escribe una persona)
        function dibujarCategorias() {
            listaCategorias.replaceChildren();
            if (categorias.length === 0) {
                const vacio = document.createElement('p');
                vacio.className = 'text-sm text-gray-400';
                vacio.textContent = 'Todavía no hay categorías: todos los eventos cobran 0%.';
                listaCategorias.appendChild(vacio);
                return;
            }
            categorias.forEach((cat) => {
                const fila = document.createElement('div');
                fila.className = 'flex flex-col sm:flex-row gap-2';
                const nombre = crearCampoCategoria(cat.nombre, `Nombre de la categoría ${cat.nombre}`, 'flex-1', { maxlength: '40' });
                const porcentaje = crearCampoCategoria(textoDePorcentaje(cat.porcentaje).replace('%', ''), `Porcentaje de ${cat.nombre}`, 'sm:w-40', { inputmode: 'decimal', maxlength: '6' });
                const guardar = document.createElement('button');
                guardar.type = 'button';
                guardar.textContent = 'Guardar';
                guardar.className = 'border border-violet-600 text-violet-700 hover:bg-violet-50 px-4 py-2 rounded-lg text-sm font-medium transition';
                guardar.addEventListener('click', () => guardarCategoria(cat.id, nombre.value, porcentaje.value, guardar));
                fila.append(nombre, porcentaje, guardar);
                listaCategorias.appendChild(fila);
            });
        }

        async function escribirCategorias(lista) {
            await setDoc(DOC_COMISIONES(), { categorias: lista.map(({ id, nombre, porcentaje }) => ({ id, nombre, porcentaje })) });
        }

        async function guardarCategoria(id, nombre, porcentaje, boton) {
            const r = validarCategoria({ nombre, porcentaje });
            if (!r.ok) { avisoServicio(r.mensaje, true); return; }
            boton.disabled = true;
            try {
                await escribirCategorias(categorias.map((c) => (c.id === id ? { id, ...r.datos } : c)));
                avisoServicio(`Guardado: ${r.datos.nombre} (${textoDePorcentaje(r.datos.porcentaje)}). Vale para las compras nuevas.`, false);
            } catch (error) {
                console.error('No se pudo guardar la categoría:', error);
                avisoServicio('No se pudo guardar. Probá de nuevo.', true);
            } finally {
                boton.disabled = false;
            }
        }

        formNuevaCategoria.addEventListener('submit', async (e) => {
            e.preventDefault();
            const campoNombre = document.getElementById('nuevaCategoriaNombre');
            const campoPorcentaje = document.getElementById('nuevaCategoriaPorcentaje');
            const r = validarCategoria({ nombre: campoNombre.value, porcentaje: campoPorcentaje.value });
            if (!r.ok) { avisoServicio(r.mensaje, true); return; }
            try {
                await escribirCategorias([...categorias, { id: nuevoIdDeCategoria(categorias), ...r.datos }]);
                campoNombre.value = '';
                campoPorcentaje.value = '';
                avisoServicio(`Categoría agregada: ${r.datos.nombre} (${textoDePorcentaje(r.datos.porcentaje)}).`, false);
            } catch (error) {
                console.error('No se pudo agregar la categoría:', error);
                avisoServicio('No se pudo agregar. Probá de nuevo.', true);
            }
        });

        // Selector "Costo de servicio" de cada evento publicado (solo superadmin)
        function htmlSelectorServicio(evento) {
            const actual = typeof evento.comisionCategoriaId === 'string' ? evento.comisionCategoriaId : '';
            const opciones = categorias.map((c) =>
                `<option value="${escaparHtml(c.id)}" ${c.id === actual ? 'selected' : ''}>${escaparHtml(c.nombre)} (${escaparHtml(textoDePorcentaje(c.porcentaje))})</option>`).join('');
            return `
                <label class="block text-xs font-medium text-gray-500 mt-3" for="servicio-${escaparHtml(evento.id)}">Costo de servicio</label>
                <select id="servicio-${escaparHtml(evento.id)}" data-servicio-evento="${escaparHtml(evento.id)}" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-violet-500 outline-none">
                    <option value="">Ninguno (0%)</option>
                    ${opciones}
                </select>`;
        }

        contenidoContainer.addEventListener('change', async (e) => {
            const selector = e.target.closest ? e.target.closest('[data-servicio-evento]') : null;
            if (!selector || !soySuperAdmin) return;
            const eventoId = selector.getAttribute('data-servicio-evento');
            const elegida = selector.value; // '' = ninguna
            // Solo se acepta una categoría que existe
            if (elegida !== '' && !categorias.some((c) => c.id === elegida)) return;
            selector.disabled = true;
            try {
                await updateDoc(doc(db, 'eventos', eventoId), { comisionCategoriaId: elegida });
                mostrarToast(elegida === '' ? 'Costo de servicio: ninguno (0%).' : 'Costo de servicio guardado.', 'exito');
            } catch (error) {
                console.error('No se pudo guardar el costo de servicio del evento:', error);
                mostrarToast('No se pudo guardar el costo de servicio. Probá de nuevo.', 'error');
            } finally {
                selector.disabled = false;
            }
        });

        // =====================================================
        // SUPERADMIN: EVENTOS DE TODAS LAS ORGANIZACIONES
        // =====================================================
        function cargarOrganizaciones() {
            onSnapshot(collection(db, "usuarios"), (snapshot) => {
                organizaciones = [];
                snapshot.forEach(d => {
                    const u = d.data();
                    if (u.rol === 'organizacion') {
                        organizaciones.push({ id: d.id, ...u });
                    }
                });
                organizaciones.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
                rellenarSelectorDeOrganizaciones();
                renderizarVista();
            });
            onSnapshot(collection(db, "eventos"), (snapEv) => {
                eventos = [];
                snapEv.forEach(d => eventos.push({ id: d.id, estado: 'publicado', ...d.data() }));
                renderizarVista();
            });
        }

        // =====================================================
        // CLIENTE: EVENTOS + SOLICITUDES
        // =====================================================
        function cargarEventos() {
            // 1. Escuchar los publicados (colección eventos)
            onSnapshot(collection(db, "eventos"), (snapshot) => {
                eventos = [];
                snapshot.forEach(doc => {
                    eventos.push({ id: doc.id, estado: 'publicado', ...doc.data() });
                });
                renderizarVista();
            });

            // 2. Escuchar los pendientes/rechazados (colección solicitudes)
            if (!soySuperAdmin && auth.currentUser) {
                const qSol = query(collection(db, "solicitudes_eventos"), where("creadoPor", "==", auth.currentUser.uid));
                onSnapshot(qSol, (snapSol) => {
                    solicitudes = [];
                    snapSol.forEach(d => {
                        const sol = d.data();
                        // Solo tomamos pendientes o rechazadas. Si fue aprobada, ya migró a "eventos".
                        if (sol.estado === 'pendiente' || sol.estado === 'rechazada') {
                            solicitudes.push({ id: d.id, ...sol });
                        }
                    });
                    renderizarVista();
                });
            }
        }

        // =====================================================
        // RENDERIZAR
        // =====================================================
        function renderizarVista() {
            if (soySuperAdmin) {
                renderizarEventosDelSuperadmin();
            } else {
                renderizarEventosCliente();
            }
        }

        // La organización a la que pertenece un evento, o undefined si no se puede saber
        function organizacionDeEvento(ev) {
            return organizaciones.find(org =>
                (ev.organizacionId && ev.organizacionId === org.organizacionId) ||
                (ev.creadoPor && ev.creadoPor === org.id) ||
                (ev.correo && ev.correo === org.email)
            );
        }

        // Selector "Todas las organizaciones": una opción por organización, sin perder lo elegido
        function rellenarSelectorDeOrganizaciones() {
            const elegida = organizacionFilter.value;
            organizacionFilter.replaceChildren(new Option('Todas las organizaciones', 'todas'));
            organizaciones.forEach(org => organizacionFilter.add(new Option(org.nombre || org.email || 'Sin nombre', org.id)));
            organizacionFilter.value = organizaciones.some(org => org.id === elegida) ? elegida : 'todas';
        }

        // ✅ Vista del superadmin: todos los eventos, con la organización de cada uno
        function renderizarEventosDelSuperadmin() {
            let lista = eventos;
            if (organizacionFilter.value !== 'todas') {
                lista = lista.filter(ev => organizacionDeEvento(ev)?.id === organizacionFilter.value);
            }
            lista = aplicarFiltrosBusqueda(lista);
            subtituloPagina.textContent = `${lista.length} ${lista.length === 1 ? 'evento' : 'eventos'}`;
            renderizarListaEventos(lista, 'No hay eventos para mostrar.');
        }

        // ✅ Vista: Eventos y Solicitudes combinados del cliente
        function renderizarEventosCliente() {
            tituloPagina.textContent = 'Eventos';
            
            // 1. Tomamos sus eventos publicados
            let misEventos = eventos.filter(ev => 
                (ev.organizacionId && ev.organizacionId === miUsuario.organizacionId) ||
                (ev.creadoPor && ev.creadoPor === auth.currentUser?.uid) ||
                (ev.correo && ev.correo === miUsuario.email)
            );

            // 2. Juntamos con sus solicitudes en espera o rechazadas (filtrando rechazadas de > 30 días)
            const ahora = new Date();
            const solicitudesRecientes = solicitudes.filter(sol => {
                if (sol.estado === 'rechazada') {
                    if (!sol.fechaRechazo) return false;
                    const fecha = new Date(sol.fechaRechazo.seconds * 1000);
                    const diasPasados = (ahora - fecha) / (1000 * 60 * 60 * 24);
                    return diasPasados <= 30;
                }
                return true;
            });
            let listaCompleta = [...misEventos, ...solicitudesRecientes];
            
            subtituloPagina.textContent = `${listaCompleta.length} registros en total`;

            let filtrados = aplicarFiltrosBusqueda(listaCompleta);
            renderizarListaEventos(filtrados, `No tenés eventos creados todavía.`);
        }

        // ✅ Aplicar filtros (Modificado para usar "estado")
        function aplicarFiltrosBusqueda(lista) {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const estado = estadoFilter.value;

            let filtrados = [...lista];

            // Filtro por tab/select
            if (estado !== 'todos') {
                filtrados = filtrados.filter(ev => (ev.estado || 'publicado') === estado);
            }

            if (searchTerm) {
                filtrados = filtrados.filter(ev => ev.nombre && ev.nombre.toLowerCase().includes(searchTerm));
            }

            return filtrados;
        }

        // ✅ Renderizar grilla (Modificada para soportar estados)
        function renderizarListaEventos(lista, mensajeVacio) {
            if (lista.length === 0) {
                contenidoContainer.innerHTML = `
                    <div class="text-center py-12">
                        <span class="material-symbols-outlined text-6xl text-gray-300">event_busy</span>
                        <p class="text-gray-400 mt-3">${mensajeVacio}</p>
                    </div>
                `;
                return;
            }

            contenidoContainer.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${lista.map(evento => {
                        const estado = evento.estado || 'publicado'; // Seguro por defecto
                        
                        let badgeClass = '';
                        let estadoTexto = '';
                        let botonHTML = '';
                        let motivoHTML = '';

                        // Configuración visual según estado
                        if (estado === 'publicado') {
                            badgeClass = 'bg-green-100 text-green-800';
                            estadoTexto = 'Publicado';
                            botonHTML = `
                                <a href="dashboard.html?id=${evento.id}" onclick="localStorage.setItem('eventoId', '${evento.id}')" class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-full text-sm font-medium transition flex items-center gap-1 w-full justify-center">
                                    <span>Ver resumen</span> <span class="material-symbols-outlined text-sm">arrow_forward</span>
                                </a>
                            `;
                        } else if (estado === 'pendiente') {
                            badgeClass = 'bg-yellow-100 text-yellow-800';
                            estadoTexto = 'Pendiente';
                            botonHTML = `
                                <button disabled class="bg-gray-100 text-gray-400 px-4 py-2 rounded-full text-sm font-medium cursor-not-allowed w-full flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-sm">hourglass_empty</span> En Revisión
                                </button>
                            `;
                        } else if (estado === 'rechazada') {
                            badgeClass = 'bg-red-100 text-red-800';
                            estadoTexto = 'Rechazada';
                            motivoHTML = `
                                <div class="mt-3 p-3 bg-red-50 rounded-lg text-sm text-red-700 border border-red-100">
                                    <strong class="block mb-1">Motivo del rechazo:</strong> 
                                    ${evento.motivoRechazo || 'No cumple con los requisitos del sitio.'}
                                    <hr class="my-2 border-red-200 opacity-50">
                                    <p class="text-xs">Nos comunicaremos con vos a la brevedad. Este evento dejará de mostrarse 30 días después del rechazo.</p>
                                </div>
                            `;
                            botonHTML = `
                                <button disabled class="bg-red-50 text-red-400 px-4 py-2 rounded-full text-sm font-medium cursor-not-allowed border border-red-100 w-full flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-sm">cancel</span> Evento Rechazado
                                </button>
                            `;
                        }

                        // El superadmin ve de qué organización es cada evento
                        const organizacionHTML = soySuperAdmin
                            ? `<p class="text-sm text-violet-600 font-medium flex items-center gap-2 mb-2 truncate">
                                    <span class="material-symbols-outlined text-[16px]">corporate_fare</span> ${escaparHtml(organizacionDeEvento(evento)?.nombre || 'Organización no identificada')}
                                </p>`
                            : '';

                        // La organización ve el último comentario del superadmin en sus solicitudes (no en los eventos publicados)
                        const comentario = estado === 'publicado' ? null : ultimoComentario(evento);
                        const comentarioHTML = comentario
                            ? `<div class="mt-3 p-3 bg-violet-50 rounded-lg text-sm text-violet-900 border border-violet-100">
                                    <strong class="block mb-1">Comentario de Evently:</strong>
                                    ${escaparHtml(comentario.texto)}
                                </div>`
                            : '';

                        return `
                            <div class="bg-white rounded-xl border border-gray-200 hover-card overflow-hidden flex flex-col">
                                <div class="relative">
                                    ${htmlDeImagenEvento(evento, { clases: 'h-40' })}
                                    <div class="absolute top-3 right-3">
                                        <span class="text-xs font-bold px-3 py-1 rounded-full shadow-sm ${badgeClass}">${estadoTexto}</span>
                                    </div>
                                </div>
                                <div class="p-5 flex-1 flex flex-col">
                                    <h3 class="text-lg font-bold text-gray-800 truncate mb-3" title="${escaparHtml(evento.nombre)}">${escaparHtml(evento.nombre || 'Sin nombre')}</h3>
                                    
                                    <p class="text-sm text-gray-500 flex items-center gap-2 mb-2 truncate">
                                        <span class="material-symbols-outlined text-[16px] text-gray-400">calendar_month</span> ${escaparHtml(evento.fecha || 'Fecha no definida')}
                                    </p>
                                    <p class="text-sm text-gray-500 flex items-center gap-2 mb-2 truncate">
                                        <span class="material-symbols-outlined text-[16px] text-gray-400">location_on</span> ${escaparHtml(evento.lugar || 'Lugar no definido')}
                                    </p>
                                    
                                    ${organizacionHTML}
                                    ${soySuperAdmin && estado === 'publicado' ? htmlSelectorServicio(evento) : ''}
                                    ${motivoHTML}
                                    ${comentarioHTML}

                                    <div class="mt-auto pt-5">
                                        ${botonHTML}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        searchInput.addEventListener('input', renderizarVista);
        organizacionFilter.addEventListener('change', renderizarVista);
        estadoFilter.addEventListener('change', function() {
            localStorage.setItem('eventoEstadoFilter', this.value);
            renderizarVista();
        });
    </script>

    <script>
        (function() {
            const eventoId = localStorage.getItem('eventoId');
            if (eventoId) {
                const linkDesktop = document.getElementById('linkPanelPrincipal');
                const linkMobile = document.getElementById('linkPanelPrincipalMobile');
                const href = `dashboard.html?id=${eventoId}`;
                if (linkDesktop) linkDesktop.href = href;
                if (linkMobile) linkMobile.href = href;
            }
        })();
    </script>

    <script src="../shared/menu-rol.js"></script>
</body>
</html>
