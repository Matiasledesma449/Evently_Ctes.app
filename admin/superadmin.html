<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evently - Panel global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; }
        .active-link { background: #ede9fe; color: #7c3aed; border-left: 4px solid #7c3aed; }
        .org-card { transition: transform 0.2s, box-shadow 0.2s; }
        .org-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    </style>
    <link rel="stylesheet" href="../shared/admin-shell.css" />
    <link rel="prefetch" href="eventos-seleccion.html" />
    <link rel="prefetch" href="consultas-publicas.html" />
    <link rel="prefetch" href="mensajes.html" />
</head>
<body class="h-screen overflow-hidden">

    <!-- Verificar autenticación y rol -->
    <script type="module" src="../shared/firebase-init.js"></script>
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "usuarios", user.uid));
            if (!userDoc.exists() || userDoc.data().rol !== 'superadmin') {
                alert('No tenés permisos para acceder a este panel.');
                window.location.href = 'eventos-seleccion.html';
            }
        });
    </script>

    <div class="flex h-screen min-h-0">
        <!-- Menú compartido del panel: lo dibuja shared/menu-admin.js (escritorio y celular) -->
        <script src="../shared/menu-admin.js" data-pagina="superadmin"></script>

        <!-- Contenido principal -->
        <main class="flex-1 min-h-0 overflow-y-auto p-6 pb-24 lg:pb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Panel global</h1>
                    <p class="text-sm text-gray-500">Visión global de todas las organizaciones</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full lg:w-auto">
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
                        <input id="searchInput" type="search" placeholder="Buscar organización..." class="w-full sm:w-56 pl-10 pr-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none">
                    </div>
                    <select id="filtroOrganizacion" aria-label="Filtrar por organización" class="border border-gray-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-violet-500 outline-none">
                        <option value="todas">Todas las organizaciones</option>
                    </select>
                    <select id="filtroPeriodo" aria-label="Filtrar por período" class="border border-gray-200 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-violet-500 outline-none">
                        <option value="7">Últimos 7 días</option>
                        <option value="30" selected>Últimos 30 días</option>
                        <option value="todos">Todo el período</option>
                    </select>
                </div>
            </div>
            <!-- SUP-03: Listado de eventos globales -->
            <div id="listaEventosGlobales" class="space-y-3 mb-6"></div>

            <!-- SECCIÓN: Solicitudes pendientes -->
            <div id="seccion-solicitudes" class="mb-8 hidden">
                <div class="flex items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <span class="material-symbols-outlined text-violet-600">notifications_active</span>
                        Solicitudes de eventos
                    </h2>
                    <span id="contador-solicitudes" class="bg-violet-600 text-white text-sm font-semibold px-3 py-1 rounded-full ml-3 shadow-sm">0</span>
                </div>
                <div id="filtros-estado-solicitudes" class="inline-flex rounded-lg border border-gray-200 bg-white p-1 mb-4" role="tablist" aria-label="Filtrar solicitudes por estado">
                    <button type="button" data-estado-solicitud="pendiente" class="px-3 py-1.5 rounded-md text-sm font-medium bg-violet-600 text-white" aria-pressed="true">Pendientes</button>
                    <button type="button" data-estado-solicitud="aprobada" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" aria-pressed="false">Aceptados</button>
                    <button type="button" data-estado-solicitud="rechazada" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100" aria-pressed="false">Rechazados</button>
                </div>
                <div id="grid-solicitudes" class="space-y-5">
                    <p class="text-gray-500 col-span-full text-center py-8" id="mensaje-vacio">Cargando solicitudes...</p>
                </div>
            </div>

        </main>
    </div>


    <!-- MODAL 1: Eventos de Organización -->
    <div id="modalEventos" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 id="modalTituloOrg" class="text-xl font-bold text-gray-800"></h3>
                    <p id="modalSubtituloOrg" class="text-sm text-gray-500"></p>
                </div>
                <button onclick="cerrarModalEventos()" class="text-gray-400 hover:text-gray-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modalEventosLista" class="space-y-3"></div>
        </div>
    </div>

    <!-- MODAL 2: Confirmación de Aprobación/Rechazo -->
    <div id="modalConfirmacion" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h3 id="modalConfirmacionTitulo" class="text-xl font-bold text-gray-900 mb-2">Confirmar Acción</h3>
            <p id="modalConfirmacionMensaje" class="text-gray-600 mb-4 text-sm">¿Estás seguro?</p>
            <div id="contenedorMotivoConfirmacion" class="hidden mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Motivo del rechazo (Opcional)</label>
                <textarea id="inputMotivoConfirmacion" rows="3" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-violet-600 focus:border-violet-600 outline-none" placeholder="Ej: Faltan detalles..."></textarea>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="btnCancelarModalConfirmacion" class="px-5 py-2 text-gray-600 font-medium rounded-lg hover:bg-gray-100 transition">Cancelar</button>
                <button id="btnConfirmarModalConfirmacion" class="px-5 py-2 text-white font-medium rounded-lg transition shadow-md min-w-[120px] bg-violet-600 hover:bg-violet-700">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal para editar únicamente solicitudes pendientes -->
    <div id="modalEditarSolicitud" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[60] px-4 py-6">
        <section class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-5 sm:p-6 max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="tituloEditarSolicitud">
            <div class="flex items-start justify-between gap-4 mb-5">
                <div>
                    <h2 id="tituloEditarSolicitud" class="text-xl font-bold text-gray-900">Editar solicitud</h2>
                    <p class="text-sm text-gray-500 mt-1">Los cambios se guardan en la solicitud pendiente.</p>
                </div>
                <button id="btnCerrarModalEditar" type="button" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100" aria-label="Cerrar edición">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <form id="formEditarSolicitud" class="space-y-4">
                <div>
                    <label for="editarNombreSolicitud" class="block text-sm font-medium text-gray-700 mb-1">Nombre del evento</label>
                    <input id="editarNombreSolicitud" maxlength="150" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-violet-500 outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="editarFechaSolicitud" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input id="editarFechaSolicitud" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-violet-500 outline-none">
                    </div>
                    <div>
                        <label for="editarLugarSolicitud" class="block text-sm font-medium text-gray-700 mb-1">Lugar</label>
                        <input id="editarLugarSolicitud" maxlength="200" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-violet-500 outline-none">
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between gap-3 mb-2">
                        <h3 class="text-sm font-semibold text-gray-800">Lotes</h3>
                        <button id="btnAgregarLoteEdicion" type="button" class="text-sm font-medium text-violet-700 hover:text-violet-900">+ Agregar lote</button>
                    </div>
                    <div id="lotesEdicionContainer" class="space-y-3"></div>
                </div>
                <p id="errorEditarSolicitud" class="hidden text-sm text-red-600" role="alert"></p>
                <div class="flex justify-end gap-2 border-t border-gray-100 pt-4">
                    <button id="btnCancelarEdicion" type="button" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancelar</button>
                    <button id="btnGuardarEdicion" type="submit" class="px-4 py-2 rounded-lg bg-violet-600 text-white font-semibold hover:bg-violet-700">Guardar cambios</button>
                </div>
            </form>
        </section>
    </div>

    <!-- Firebase y lógica principal -->
    <script type="module">
        import { collection, query, where, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { soloConfirmadas } from "../shared/ventas-utils.js";

        const db = window.db;
        const auth = window.auth;

        const searchInput = document.getElementById('searchInput');
        const filtroOrganizacion = document.getElementById('filtroOrganizacion');
        const filtroPeriodo = document.getElementById('filtroPeriodo');
        const modalEventos = document.getElementById('modalEventos');
        const modalTituloOrg = document.getElementById('modalTituloOrg');
        const modalSubtituloOrg = document.getElementById('modalSubtituloOrg');
        const modalEventosLista = document.getElementById('modalEventosLista');

        let organizaciones = [];
        let eventosGlobales = [];
        let ventasGlobales = [];

        // Cerrar sesión
        // Cargar datos
        function cargarOrganizaciones() {
            const q = query(collection(db, "usuarios"), where("rol", "==", "organizacion"));
            onSnapshot(q, (snapshot) => {
                organizaciones = [];
                snapshot.forEach(d => organizaciones.push({ id: d.id, ...d.data() }));
                rellenarFiltroOrganizaciones();
                renderizarEventosGlobales();
            });
        }

        function cargarEventosGlobales() {
            onSnapshot(collection(db, "eventos"), (snapshot) => {
                eventosGlobales = [];
                snapshot.forEach(d => eventosGlobales.push({ id: d.id, ...d.data() }));
                renderizarEventosGlobales();
            });
        }

        function cargarVentasGlobales() {
            onSnapshot(collection(db, "ventas"), (snapshot) => {
                ventasGlobales = [];
                snapshot.forEach(d => ventasGlobales.push({ id: d.id, ...d.data() }));
                renderizarEventosGlobales();
            });
        }

        function fechaDeValor(valor) {
            if (valor && typeof valor.toDate === 'function') return valor.toDate();
            if (valor instanceof Date) return valor;
            if (typeof valor === 'string') {
                const tiempo = Date.parse(valor);
                if (!Number.isNaN(tiempo)) return new Date(tiempo);
            }
            return null;
        }

        function dentroDelPeriodo(valor) {
            if (filtroPeriodo.value === 'todos') return true;
            const fecha = fechaDeValor(valor);
            if (!fecha) return true;
            const limite = new Date();
            limite.setDate(limite.getDate() - Number(filtroPeriodo.value));
            return fecha >= limite;
        }

        function perteneceAOrganizacion(item, org) {
            return (item.organizacionId && item.organizacionId === (org.organizacionId || org.id))
                || item.creadoPor === org.id
                || (item.correo && org.email && item.correo.toLowerCase() === org.email.toLowerCase());
        }

        function organizacionesFiltradas() {
            const texto = searchInput.value.toLowerCase().trim();
            return organizaciones.filter(org => {
                const coincideSelector = filtroOrganizacion.value === 'todas' || org.id === filtroOrganizacion.value;
                const coincideTexto = !texto || [org.nombre, org.email, org.organizacionId]
                    .some(valor => (valor || '').toLowerCase().includes(texto));
                return coincideSelector && coincideTexto;
            });
        }

        function eventosDeOrganizacion(org) {
            return eventosGlobales.filter(evento => perteneceAOrganizacion(evento, org)
                && dentroDelPeriodo(evento.fechaPublicacion || evento.createdAt || evento.fechaCreacion));
        }

        function ventasDeOrganizacion(org) {
            const idsEventos = new Set(eventosGlobales.filter(evento => perteneceAOrganizacion(evento, org)).map(evento => evento.id));
            return ventasGlobales.filter(venta => idsEventos.has(venta.eventoId) && dentroDelPeriodo(venta.fecha));
        }

        function rellenarFiltroOrganizaciones() {
            const seleccionActual = filtroOrganizacion.value;
            filtroOrganizacion.replaceChildren(new Option('Todas las organizaciones', 'todas'));
            [...organizaciones]
                .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'))
                .forEach(org => filtroOrganizacion.add(new Option(org.nombre || org.email || 'Sin nombre', org.id)));
            filtroOrganizacion.value = organizaciones.some(org => org.id === seleccionActual) ? seleccionActual : 'todas';
        }

                function renderizarEventosGlobales() {
            const contenedor = document.getElementById('listaEventosGlobales');
            if (!contenedor) return;

            const orgs = organizacionesFiltradas();
            const pares = orgs.flatMap(org =>
                eventosDeOrganizacion(org).map(ev => ({ ev, org }))
            );

            pares.sort((a, b) => {
                const fa = a.ev.fechaPublicacion || a.ev.createdAt || a.ev.fechaCreacion;
                const fb = b.ev.fechaPublicacion || b.ev.createdAt || b.ev.fechaCreacion;
                const ta = (fa && fa.seconds) || 0;
                const tb = (fb && fb.seconds) || 0;
                return tb - ta;
            });

            if (pares.length === 0) {
                contenedor.innerHTML = '<p class="text-sm text-gray-400 p-4">No hay eventos para mostrar.</p>';
                return;
            }

            const mostrarOrg = filtroOrganizacion.value === 'todas';

            contenedor.innerHTML = pares.map(({ ev, org }) => {
                // Solo ventas confirmadas: las pendientes y rechazadas no suman dinero ni entradas
                const ventasEv = soloConfirmadas(ventasGlobales.filter(v => v.eventoId === ev.id));
                const recaudado = ventasEv.reduce((s, v) => s + (Number(v.monto_total) || 0), 0);
                const entradas = ventasEv.reduce((s, v) => s + (Number(v.cantidad) || 0), 0);
                const fecha = ev.fechaPublicacion || ev.createdAt || ev.fechaCreacion;
                const fechaTexto = (fecha && fecha.seconds)
                    ? new Date(fecha.seconds * 1000).toLocaleDateString('es-AR')
                    : 'Sin fecha';

                return `
                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-gray-800 truncate">${ev.nombre || 'Sin nombre'}</h3>
                                ${mostrarOrg ? `<p class="text-xs text-violet-600 font-medium mt-1">${org.nombre || org.email || 'Organización'}</p>` : ''}
                                <p class="text-xs text-gray-500 mt-1">${ev.lugar || 'Sin lugar'} · ${fechaTexto}</p>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <p class="text-sm font-semibold text-gray-800">$${recaudado.toLocaleString('es-AR')}</p>
                                <p class="text-xs text-gray-500">${entradas} entradas</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.verEventosDeOrg = function(orgId) {
            const org = organizaciones.find(o => o.id === orgId);
            if (!org) return;
            const eventosOrg = eventosGlobales.filter(e =>
                (e.organizacionId && e.organizacionId === org.organizacionId) ||
                (e.creadoPor && e.creadoPor === org.id) ||
                (e.correo && e.correo === org.email)
            );

            modalTituloOrg.textContent = org.nombre || 'Organización';
            modalSubtituloOrg.textContent = `${eventosOrg.length} eventos`;

            if (eventosOrg.length === 0) {
                modalEventosLista.innerHTML = `
                    <div class="text-center py-8">
                        <span class="material-symbols-outlined text-5xl text-gray-300">event_busy</span>
                        <p class="text-gray-400 mt-2">Sin eventos todavía.</p>
                    </div>
                `;
            } else {
                modalEventosLista.innerHTML = eventosOrg.map(ev => {
                    // Solo ventas confirmadas: las pendientes y rechazadas no suman dinero ni entradas
                    const ventasEv = soloConfirmadas(ventasGlobales.filter(v => v.eventoId === ev.id));
                    const recaudado = ventasEv.reduce((sum, v) => sum + (v.monto_total || 0), 0);
                    const entradas = ventasEv.reduce((sum, v) => sum + (v.cantidad || 0), 0);
                    return `
                        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex justify-between items-start gap-3">
                                <div class="min-w-0">
                                    <h4 class="font-semibold text-gray-800 truncate">${ev.nombre || 'Sin nombre'}</h4>
                                    <p class="text-xs text-gray-500 mt-0.5">${ev.fecha || 'Sin fecha'} · ${ev.lugar || 'Sin lugar'}</p>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <p class="text-sm font-bold text-violet-600">$${recaudado.toLocaleString()}</p>
                                    <p class="text-[10px] text-gray-500">${entradas} entradas</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            modalEventos.classList.remove('hidden');
            modalEventos.classList.add('flex');
        };

        window.cerrarModalEventos = function() {
            modalEventos.classList.add('hidden');
            modalEventos.classList.remove('flex');
        };

        function aplicarFiltrosPanel() {
            renderizarEventosGlobales();
        }

        searchInput.addEventListener('input', aplicarFiltrosPanel);
        filtroOrganizacion.addEventListener('change', aplicarFiltrosPanel);
        filtroPeriodo.addEventListener('change', aplicarFiltrosPanel);

        (function() {
            const eventoId = localStorage.getItem('eventoId');
            if (eventoId) {
                const link = document.getElementById('linkPanelPrincipal');
                if (link) link.href = `dashboard.html?id=${eventoId}`;
            }
        })();

        cargarOrganizaciones();
        cargarEventosGlobales();
        cargarVentasGlobales();
    </script>

    <!-- Script de aprobaciones -->
    <script type="module" src="aprobaciones.js"></script>
    <script src="../shared/menu-rol.js"></script>
</body>
</html>
