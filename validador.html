<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evently - Validador QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        #video-container { width: 100%; max-width: 450px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #000; position: relative; }
        video { width: 100%; display: block; transform: scaleX(-1); } /* Espejo para selfie, pero en frontal se ve natural */
        .result-box { padding: 16px; border-radius: 12px; text-align: center; margin-top: 16px; transition: all 0.3s; }
        .success { background: #dcfce7; color: #166534; border: 2px solid #16a34a; }
        .error { background: #fee2e2; color: #991b1b; border: 2px solid #dc2626; }
        .info { background: #f3f4f6; color: #1f2937; border: 2px solid #d1d5db; }
        .btn-retry { display: inline-block; margin-top: 16px; padding: 10px 24px; background: #7c3aed; color: white; border-radius: 9999px; font-weight: 600; cursor: pointer; border: none; transition: background 0.2s; width: 100%; }
        .btn-retry:hover { background: #5b21b6; }
        .flash-btn { position: absolute; bottom: 16px; right: 16px; background: rgba(255,255,255,0.8); border: none; border-radius: 9999px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 10; backdrop-filter: blur(4px); }
        .flash-btn:hover { background: white; transform: scale(1.05); }
        #mensajeLuz { font-size: 0.875rem; margin-top: 8px; background: #fff3cd; color: #856404; padding: 6px 12px; border-radius: 8px; border: 1px solid #ffeeba; transition: all 0.3s; }
        #mensajeLuz.hidden { display: none; }
        .badge { display: inline-block; background: #e5e7eb; color: #374151; font-size: 0.7rem; padding: 2px 8px; border-radius: 9999px; margin-top: 4px; }
        #loading { display: none; font-size: 0.9rem; color: #6b7280; }
    </style>
</head>
<body>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 relative">
        <div class="text-center mb-4">
            <h1 class="text-2xl font-bold text-violet-600">Evently <span class="text-gray-800">Validador</span></h1>
            <p class="text-sm text-gray-500">Escanea el QR de la entrada</p>
        </div>

        <div id="video-container" class="relative">
            <video id="video" playsinline></video>
            <!-- Botón linterna -->
            <button id="btnLinterna" class="flash-btn" title="Encender linterna">
                <span class="material-symbols-outlined">flashlight_off</span>
            </button>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>

        <!-- Mensaje de poca luz -->
        <div id="mensajeLuz" class="hidden">
            <span class="material-symbols-outlined text-sm align-middle">warning</span>
            ⚠️ Poca luz. Enciende una linterna o acércate a una fuente de luz.
        </div>

        <div id="resultado" class="result-box info">
            <span class="material-symbols-outlined text-3xl">qr_code_scanner</span><br>
            Apunta la cámara al código QR
        </div>

        <button id="btnReiniciar" class="btn-retry hidden" onclick="reiniciarEscaneo()">
            Escanear otra entrada
        </button>
        <!-- Si la cámara no lee el QR (pantalla rota, poca luz): se escribe el código que figura abajo del QR -->
        <form id="formCodigoManual" class="mt-4 flex gap-2">
            <label for="codigoManual" class="sr-only">Código de la entrada</label>
            <input id="codigoManual" type="text" autocomplete="off" autocapitalize="characters" maxlength="80" placeholder="O escribí el código (ENT-...)" class="flex-1 min-w-0 border border-gray-300 rounded-full px-4 py-2 text-sm font-mono focus:ring-2 focus:ring-violet-500 outline-none">
            <button type="submit" class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-full text-sm font-semibold">Validar</button>
        </form>

        <!-- Indicador de carga (cuando se valida en Firebase) -->
        <div id="loading" class="text-center text-gray-500 mt-2">
            <span class="material-symbols-outlined animate-spin">progress_activity</span> Validando...
        </div>
    </div>

    <!-- La validación la hace el servidor (/api/validador): el navegador no lee ni escribe la base de datos.
         El enlace trae una clave (#clave=...) que arma el panel en "Escáner"; vale unos días y se recuerda en este equipo. -->
    <script type="module">

        // Elementos DOM
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const resultado = document.getElementById('resultado');
        const btnReiniciar = document.getElementById('btnReiniciar');
        const mensajeLuz = document.getElementById('mensajeLuz');
        const btnLinterna = document.getElementById('btnLinterna');
        const loadingDiv = document.getElementById('loading');

        let scanning = true;
        let stream = null;
        let wakeLock = null;

        // ============ FUNCIONES ============

        // Mantener pantalla activa (Wake Lock)
        async function mantenerPantallaActiva() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('🔒 Pantalla mantenida activa');
            } catch (e) {
                console.warn('Wake Lock no disponible', e);
            }
        }

        // Iniciar cámara
        async function iniciarCamara() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                await video.play();

                // Wake Lock
                mantenerPantallaActiva();

                // Escaneo continuo
                requestAnimationFrame(escanearCuadro);
                // Verificar brillo
                requestAnimationFrame(verificarBrillo);
            } catch (err) {
                resultado.className = 'result-box error';
                resultado.innerHTML = '❌ Error al acceder a la cámara. Permite el acceso.';
                console.error(err);
            }
        }

        // Escaneo de QR
        function escanearCuadro() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });
                if (code && code.data) {
                    scanning = false;
                    procesarQR(code.data);
                    return;
                }
            }
            requestAnimationFrame(escanearCuadro);
        }

        // Verificar brillo
        function verificarBrillo() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                let total = 0;
                for (let i = 0; i < data.length; i += 4) {
                    total += data[i] + data[i+1] + data[i+2];
                }
                const avg = total / (data.length / 4 * 3);
                if (avg < 50) {
                    mensajeLuz.classList.remove('hidden');
                } else {
                    mensajeLuz.classList.add('hidden');
                }
            }
            requestAnimationFrame(verificarBrillo);
        }

        // ============ CLAVE DEL ENLACE ============
        // Viene en la dirección (#clave=...). Se guarda en este equipo para que recargar la página no la pierda.
        let claveValidador = '';
        try {
            const enLaDireccion = new URLSearchParams(location.hash.slice(1)).get('clave') || '';
            if (enLaDireccion) {
                localStorage.setItem('claveValidador', enLaDireccion);
                history.replaceState(null, '', location.pathname); // la clave no queda a la vista en la barra
            }
            claveValidador = enLaDireccion || localStorage.getItem('claveValidador') || '';
        } catch (e) { /* sin almacenamiento: se usa solo la de la dirección */ }
        // Si pegan un enlace nuevo en esta misma pestaña (solo cambia lo que va después de #), se vuelve a leer
        window.addEventListener('hashchange', () => location.reload());

        // Arma el cartel del resultado con textContent (lo que llega nunca se interpreta como HTML)
        function mostrarResultado(tipo, icono, titulo, lineas = [], insignias = []) {
            resultado.className = `result-box ${tipo}`;
            resultado.replaceChildren();
            const i = document.createElement('span');
            i.className = 'material-symbols-outlined text-4xl';
            i.textContent = icono;
            const t = document.createElement('p');
            t.className = 'font-bold text-lg';
            t.textContent = titulo;
            resultado.append(i, t);
            lineas.filter(Boolean).forEach((l) => {
                const p = document.createElement('p');
                p.className = 'text-sm';
                p.textContent = l;
                resultado.append(p);
            });
            insignias.filter(Boolean).forEach((texto) => {
                const b = document.createElement('span');
                b.className = 'badge mx-0.5';
                b.textContent = texto;
                resultado.append(b);
            });
        }

        function sinClave() {
            scanning = false;
            mostrarResultado('error', 'link_off', 'Falta el enlace del validador',
                ['Pedile al organizador el enlace del validador (panel → Escáner) y abrilo en este celular.']);
        }

        // Vibra distinto si la entrada vale o no (si el celular lo permite)
        const vibrar = (patron) => { try { if (navigator.vibrate) navigator.vibrate(patron); } catch (e) { /* sin vibración */ } };

        // ============ VALIDACIÓN EN EL SERVIDOR ============
        async function procesarQR(qrData) {
            if (!claveValidador) { sinClave(); return; }
            loadingDiv.style.display = 'block';
            mostrarResultado('info', 'hourglass_top', 'Validando entrada...');
            const codigo = String(qrData || '').trim().slice(0, 100);
            try {
                const respuesta = await fetch('/api/validador', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: 'validar', clave: claveValidador, codigo }),
                });
                let datos = null;
                try { datos = await respuesta.json(); } catch (e) { datos = null; }
                const insignias = datos ? [datos.evento && `Evento: ${datos.evento}`, datos.lote && `Lote: ${datos.lote}`, datos.numero && `Entrada ${datos.numero}`] : [];
                if (respuesta.ok && datos && datos.ok === true) {
                    vibrar(120);
                    mostrarResultado('success', 'check_circle', '✅ Entrada válida: puede pasar', [datos.comprador && `A nombre de: ${datos.comprador}`], insignias);
                } else {
                    vibrar([80, 60, 80, 60, 200]);
                    const err = (datos && datos.error) || {};
                    if (err.codigo === 'ENLACE_VENCIDO' || err.codigo === 'ENLACE_INVALIDO') {
                        try { localStorage.removeItem('claveValidador'); } catch (e) { /* sin almacenamiento */ }
                        claveValidador = '';
                    }
                    const usada = err.codigo === 'YA_USADA';
                    const cuando = usada && datos.usadaEn ? `Se usó el ${new Date(datos.usadaEn).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}.` : '';
                    mostrarResultado('error', usada ? 'block' : 'error', usada ? '⛔ Entrada ya utilizada' : '❌ Entrada no válida',
                        [err.mensaje || 'No se pudo validar. Probá de nuevo.', cuando, usada && datos.comprador ? `A nombre de: ${datos.comprador}` : ''], usada ? insignias : []);
                }
            } catch (error) {
                console.error('Error al validar:', error);
                mostrarResultado('error', 'wifi_off', 'Sin conexión', ['No se pudo conectar con el servidor. Revisá la señal y probá de nuevo.']);
            } finally {
                loadingDiv.style.display = 'none';
                btnReiniciar.classList.remove('hidden');
            }
        }

        // Código escrito a mano (el mismo control que el QR, en el servidor)
        document.getElementById('formCodigoManual').addEventListener('submit', (e) => {
            e.preventDefault();
            const campo = document.getElementById('codigoManual');
            const codigo = campo.value.trim();
            if (!codigo) return;
            scanning = false;
            campo.value = '';
            // Los códigos actuales son ENT- y 24 letras/números en minúscula: si se escribieron en mayúscula se corrigen
            procesarQR(/^ent-[0-9a-f]{24}$/i.test(codigo) ? 'ENT-' + codigo.slice(4).toLowerCase() : codigo);
        });

        // ============ REINICIAR ESCANEO ============
        function reiniciarEscaneo() {
            scanning = true;
            btnReiniciar.classList.add('hidden');
            resultado.className = 'result-box info';
            resultado.innerHTML = `
                <span class="material-symbols-outlined text-3xl">qr_code_scanner</span><br>
                Apunta la cámara al código QR
            `;
            mensajeLuz.classList.add('hidden');
            if (!claveValidador) { sinClave(); return; }
            // Si la cámara se detuvo, reiniciar
            if (!video.srcObject) {
                iniciarCamara();
            } else {
                requestAnimationFrame(escanearCuadro);
                requestAnimationFrame(verificarBrillo);
            }
        }

        // ============ LINTERNA (TORCH) ============
        let linternaEncendida = false;
        btnLinterna.addEventListener('click', async () => {
            const track = stream?.getVideoTracks()[0];
            if (!track) {
                alert('La cámara aún no está activa.');
                return;
            }
            try {
                linternaEncendida = !linternaEncendida;
                await track.applyConstraints({ advanced: [{ torch: linternaEncendida }] });
                btnLinterna.innerHTML = linternaEncendida ?
                    '<span class="material-symbols-outlined">flashlight_on</span>' :
                    '<span class="material-symbols-outlined">flashlight_off</span>';
            } catch (e) {
                alert('Tu dispositivo no soporta la linterna desde el navegador.');
                linternaEncendida = false;
            }
        });

        // ============ INICIALIZAR ============
        window.onload = () => {
            if (!claveValidador) { sinClave(); return; }
            // Cargar jsQR (si no está cargado desde CDN, pero lo tenemos en el <head>)
            if (typeof jsQR === 'undefined') {
                // Cargar dinámicamente
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
                script.onload = () => iniciarCamara();
                document.head.appendChild(script);
            } else {
                iniciarCamara();
            }

            // Liberar Wake Lock al salir
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden' && wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                }
            });
        };

        // Exponer reiniciarEscaneo al ámbito global para el botón onclick
        window.reiniciarEscaneo = reiniciarEscaneo;
    </script>

    <!-- jsQR (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</body>
</html>
